<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:transparent; width:100%; height:100%; overflow:hidden;
    font-family:"SF Pro Display","Segoe UI Variable Display","Segoe UI",sans-serif;
    -webkit-user-select:none; user-select:none; }
  .card { width:100%; height:100%; border-radius:16px; display:flex; align-items:center; gap:18px;
    padding:16px 22px; background:rgba(30,30,34,.28);
    border:1px solid rgba(255,255,255,.10); box-shadow:inset 0 1px 0 rgba(255,255,255,.12); }
  svg { flex:0 0 auto; }
  .right { display:flex; flex-direction:column; }
  .city { font-size:14px; font-weight:600; color:rgba(255,255,255,.75); letter-spacing:.4px; }
  .time { font-size:44px; font-weight:600; color:#fff; font-variant-numeric:tabular-nums; line-height:1.1; }
  .date { font-size:13px; color:rgba(255,255,255,.6); }
</style></head><body>
<div class="card">
  <svg width="120" height="120" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="57" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.22)" stroke-width="1.5"/>
    <g id="ticks" stroke="rgba(255,255,255,.55)" stroke-width="2"></g>
    <line id="h" x1="60" y1="60" x2="60" y2="32" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
    <line id="m" x1="60" y1="60" x2="60" y2="20" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <line id="s" x1="60" y1="66" x2="60" y2="14" stroke="#ff9f0a" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="60" cy="60" r="3.2" fill="#ff9f0a"/>
  </svg>
  <div class="right">
    <div class="city">CUPERTINO</div>
    <div class="time" id="t">--:--</div>
    <div class="date" id="d"></div>
  </div>
</div>
<script>
  const ticks = document.getElementById('ticks');
  for (let i=0;i<12;i++){
    const a=i*Math.PI/6, r1=50, r2=55;
    ticks.innerHTML += `<line x1="${60+r1*Math.sin(a)}" y1="${60-r1*Math.cos(a)}" x2="${60+r2*Math.sin(a)}" y2="${60-r2*Math.cos(a)}"/>`;
  }
  const H=document.getElementById('h'), M=document.getElementById('m'), S=document.getElementById('s');
  const T=document.getElementById('t'), D=document.getElementById('d');
  function rot(el,deg){ el.setAttribute('transform',`rotate(${deg} 60 60)`); }
  function frame(){
    const n=new Date(), ms=n.getMilliseconds();
    const s=n.getSeconds()+ms/1000, m=n.getMinutes()+s/60, h=(n.getHours()%12)+m/60;
    rot(S,s*6); rot(M,m*6); rot(H,h*30);   // 平滑扫秒 = 持续重绘负载（真实时钟组件形态)
    T.textContent=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
    D.textContent=n.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body></html>
