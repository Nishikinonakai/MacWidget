<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="widget.css">
<style>
  /* 时钟：Small（180 帧）单表盘近满卡；Medium（≥300px 视口）世界时钟四表盘
     （macOS World Clock 形态：昼=浅盘深针、夜=深盘白针，城市名列盘下）。 */
  .content { display:flex; align-items:center; justify-content:center; }
  svg.big { width: 148px; height: 148px; }
  .face  { fill: none; stroke: var(--hairline); stroke-width: 1; }
  .num   { font-size: 11.5px; font-weight: 600; fill: var(--fg2); }
  .city  { font-size: 10.5px; font-weight: 600; fill: var(--fg2); letter-spacing: .6px; }
  .hand  { stroke: var(--fg); stroke-linecap: round; }
  .sec   { stroke: var(--tint); stroke-width: 1.4; stroke-linecap: round; }
  .hub   { fill: var(--tint); }
  .hub2  { fill: var(--card-bg); }

  .world { display:none; }
  @media (min-width: 300px) {
    svg.big { display:none; }
    .world { display:flex; gap:20px; align-items:center; justify-content:center; }
    .wc { display:flex; flex-direction:column; align-items:center; gap:6px; }
    .wc svg { width:64px; height:64px; }
    .wc .cn { font-size:11px; font-weight:600; color:var(--fg2); }
    /* 昼夜盘面：局部对比自足，不跟卡面深浅走（macOS 同款语义） */
    .wc .wface { fill:#F5F5F7; stroke:rgba(0,0,0,.10); stroke-width:1; }
    .wc .wh, .wc .wm { stroke:#1d1d1f; stroke-linecap:round; }
    .wc .whub { fill:#1d1d1f; }
    .wc.night .wface { fill:#17171A; stroke:rgba(255,255,255,.14); }
    .wc.night .wh, .wc.night .wm { stroke:#fff; }
    .wc.night .whub { fill:#fff; }
  }
</style></head><body>
<div class="card"><div class="content">
  <svg class="big" viewBox="0 0 148 148">
    <circle class="face" cx="74" cy="74" r="72"/>
    <text class="city" x="74" y="46" text-anchor="middle">杭州</text>
    <g id="nums"></g>
    <line id="h" class="hand" x1="74" y1="74" x2="74" y2="42" stroke-width="4.6"/>
    <line id="m" class="hand" x1="74" y1="74" x2="74" y2="26" stroke-width="3.2"/>
    <line id="s" class="sec"  x1="74" y1="82" x2="74" y2="20"/>
    <circle class="hub"  cx="74" cy="74" r="3.4"/>
    <circle class="hub2" cx="74" cy="74" r="1.3"/>
  </svg>
  <div class="world" id="world"></div>
</div></div>
<script>
  const N = document.getElementById('nums');
  for (let i = 1; i <= 12; i++) {
    const a = i * Math.PI / 6, r = 63;
    N.innerHTML += `<text class="num" x="${74 + r * Math.sin(a)}" y="${74 - r * Math.cos(a) + 4}" text-anchor="middle">${i}</text>`;
  }
  const H = document.getElementById('h'), M = document.getElementById('m'), S = document.getElementById('s');
  const rot = (el, deg) => el.setAttribute('transform', `rotate(${deg} 74 74)`);

  // 世界时钟：Intl 时区（IANA 名，零宿主依赖）；偏移每分钟重算（够 DST）
  const CITIES = [['杭州','Asia/Shanghai'], ['东京','Asia/Tokyo'], ['伦敦','Europe/London'], ['纽约','America/New_York']];
  const world = document.getElementById('world');
  world.innerHTML = CITIES.map(([cn], i) => `
    <div class="wc" id="wc${i}">
      <svg viewBox="0 0 64 64">
        <circle class="wface" cx="32" cy="32" r="30.5"/>
        <line id="wh${i}" class="wh" x1="32" y1="32" x2="32" y2="18" stroke-width="3"/>
        <line id="wm${i}" class="wm" x1="32" y1="32" x2="32" y2="11" stroke-width="2.2"/>
        <circle class="whub" cx="32" cy="32" r="2"/>
      </svg>
      <div class="cn">${cn}</div>
    </div>`).join('');
  const wrot = (id, deg) => document.getElementById(id).setAttribute('transform', `rotate(${deg} 32 32)`);

  const offs = CITIES.map(() => 0);
  function calcOffsets() {
    const now = Date.now();
    CITIES.forEach(([, tz], i) => {
      const p = Object.fromEntries(new Intl.DateTimeFormat('en-GB',
        { timeZone: tz, hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: false })
        .formatToParts(now).map(x => [x.type, x.value]));
      const d = new Date(now);
      const tzSec = (+p.hour % 24) * 3600 + (+p.minute) * 60 + (+p.second);
      const loSec = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();
      offs[i] = ((tzSec - loSec) % 86400 + 86400) % 86400 * 1000;   // 相对本地的正向毫秒偏移
    });
  }
  calcOffsets();
  setInterval(calcOffsets, 60000);

  function frame() {
    const n = new Date(), ms = n.getMilliseconds();
    const s = n.getSeconds() + ms / 1000, m = n.getMinutes() + s / 60, h = (n.getHours() % 12) + m / 60;
    rot(S, s * 6); rot(M, m * 6); rot(H, h * 30);   // 平滑扫秒（真实时钟组件负载形态）
    CITIES.forEach((_, i) => {
      const t = new Date(n.getTime() + offs[i]);
      const wm = t.getMinutes() + t.getSeconds() / 60, wh = (t.getHours() % 12) + wm / 60;
      wrot('wh' + i, wh * 30); wrot('wm' + i, wm * 6);
      document.getElementById('wc' + i).classList.toggle('night', t.getHours() < 6 || t.getHours() >= 18);
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body></html>
