<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="widget.css">
<style>
  /* 时钟 · Small（180 帧 / 164 卡）：表盘近满卡，城市名嵌盘内上方（macOS City clock 形态） */
  .content { display:flex; align-items:center; justify-content:center; }
  svg { width: 148px; height: 148px; }
  .face  { fill: none; stroke: var(--hairline); stroke-width: 1; }
  .num   { font-size: 11.5px; font-weight: 600; fill: var(--fg2); }
  .city  { font-size: 10.5px; font-weight: 600; fill: var(--fg2); letter-spacing: .6px; }
  .hand  { stroke: var(--fg); stroke-linecap: round; }
  .sec   { stroke: var(--tint); stroke-width: 1.4; stroke-linecap: round; }
  .hub   { fill: var(--tint); }
  .hub2  { fill: var(--card-bg); }
</style></head><body>
<div class="card"><div class="content">
  <svg viewBox="0 0 148 148">
    <circle class="face" cx="74" cy="74" r="72"/>
    <text class="city" x="74" y="46" text-anchor="middle">杭州</text>
    <g id="nums"></g>
    <line id="h" class="hand" x1="74" y1="74" x2="74" y2="42" stroke-width="4.6"/>
    <line id="m" class="hand" x1="74" y1="74" x2="74" y2="26" stroke-width="3.2"/>
    <line id="s" class="sec"  x1="74" y1="82" x2="74" y2="20"/>
    <circle class="hub"  cx="74" cy="74" r="3.4"/>
    <circle class="hub2" cx="74" cy="74" r="1.3"/>
  </svg>
</div></div>
<script>
  const N = document.getElementById('nums');
  for (let i = 1; i <= 12; i++) {
    const a = i * Math.PI / 6, r = 63;
    N.innerHTML += `<text class="num" x="${74 + r * Math.sin(a)}" y="${74 - r * Math.cos(a) + 4}" text-anchor="middle">${i}</text>`;
  }
  const H = document.getElementById('h'), M = document.getElementById('m'), S = document.getElementById('s');
  const rot = (el, deg) => el.setAttribute('transform', `rotate(${deg} 74 74)`);
  function frame() {
    const n = new Date(), ms = n.getMilliseconds();
    const s = n.getSeconds() + ms / 1000, m = n.getMinutes() + s / 60, h = (n.getHours() % 12) + m / 60;
    rot(S, s * 6); rot(M, m * 6); rot(H, h * 30);   // 平滑扫秒（真实时钟组件负载形态）
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body></html>
