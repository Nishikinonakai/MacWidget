<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="widget.css">
<style>
  :root { --tint:#0A84FF; }
  html.mono.cfgmode { --tint:#0A84FF; }
  .content { perspective:1000px; }
  .flip { position:absolute; inset:0; transform-style:preserve-3d; transition:transform .45s cubic-bezier(.35,0,.25,1); }
  html.cfgmode .flip { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; backface-visibility:hidden; border-radius:inherit; overflow:hidden; }
  .front { padding:13px; }
  .grid { height:100%; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr); gap:7px; }
  .link { border:0; min-width:0; border-radius:11px; background:var(--hairline); color:var(--fg); font:inherit;
    cursor:pointer; padding:7px 8px; display:flex; align-items:center; gap:8px; text-align:left; }
  .link:hover { filter:brightness(1.12); }
  .link:active { transform:scale(.97); }
  .icon { width:28px; height:28px; flex:0 0 28px; border-radius:8px; display:grid; place-items:center;
    color:#fff; font-size:13px; font-weight:750; text-transform:uppercase; }
  .label { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11.5px; font-weight:650; }
  .empty { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--fg2); text-align:center; gap:5px; }
  .empty b { color:var(--fg); font-size:14px; }
  .empty span { font-size:11px; }
  .back { transform:rotateY(180deg); background:var(--card-bg); padding:10px 12px; display:flex; flex-direction:column; gap:6px; }
  .back-head { display:flex; align-items:center; justify-content:space-between; }
  .back h3 { font-size:13px; color:var(--fg); font-weight:650; }
  .fields { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:4px; padding-right:3px; }
  .fields::-webkit-scrollbar { width:5px; } .fields::-webkit-scrollbar-thumb { background:var(--hairline); border-radius:3px; }
  .row { display:grid; grid-template-columns:92px 1fr; gap:5px; }
  input { min-width:0; width:100%; border:0; outline:0; border-radius:6px; background:var(--hairline); color:var(--fg);
    font:inherit; font-size:10.5px; padding:5px 7px; user-select:text; -webkit-user-select:text; }
  input:focus { box-shadow:inset 0 0 0 1.5px var(--tint); }
  .actions { display:flex; justify-content:flex-end; gap:6px; }
  .actions button { border:0; border-radius:7px; font:inherit; font-size:11px; font-weight:650; padding:5px 13px; cursor:pointer; }
  #clear { background:var(--hairline); color:var(--fg2); }
  #done { background:var(--tint); color:#fff; }
</style></head><body>
<div class="card"><div class="content"><div class="flip">
  <div class="face front" id="frontFace"><div class="grid" id="grid"></div></div>
  <div class="face back" id="backFace" aria-hidden="true" inert>
    <div class="back-head"><h3>快捷网址</h3></div>
    <div class="fields" id="fields"></div>
    <div class="actions"><button id="clear">清除</button><button id="done">完成</button></div>
  </div>
</div></div></div>
<script>
  const MAX = 6;
  const grid = document.getElementById('grid');
  const fields = document.getElementById('fields');
  function normalized(value) { value=(value||'').trim(); return value && !value.includes('://') ? 'https://'+value : value; }
  function fallbackLabel(url) {
    try { return new URL(normalized(url)).hostname.replace(/^www\./,''); } catch { return url || 'Link'; }
  }
  function colorFor(value) {
    let hash=0; for (const ch of value) hash=(hash*31+ch.codePointAt(0))>>>0;
    return `hsl(${hash%360} 62% 52%)`;
  }
  function linksFromCfg() {
    const value = window.mw?.cfg()?.links;
    return Array.isArray(value) ? value.slice(0,MAX).map(item => ({
      name:String(item?.name||'').slice(0,40), url:String(item?.url||'').slice(0,500)
    })).filter(item => item.url.trim()) : [];
  }
  function render(links) {
    grid.replaceChildren();
    if (!links.length) {
      const empty=document.createElement('div'); empty.className='empty'; empty.style.gridColumn='1 / -1';
      const title=document.createElement('b'); title.textContent='快捷网址';
      const hint=document.createElement('span'); hint.textContent='右键 → 编辑「快捷网址」来添加';
      empty.append(title,hint); grid.append(empty); return;
    }
    for (const item of links) {
      const label=(item.name.trim()||fallbackLabel(item.url)).slice(0,40);
      const button=document.createElement('button'); button.className='link'; button.type='button'; button.dataset.url=item.url;
      button.setAttribute('data-mw-no-localize','');
      button.setAttribute('aria-label',label);
      const icon=document.createElement('span'); icon.className='icon'; icon.style.background=colorFor(item.url);
      icon.textContent=Array.from(label)[0]||'↗';
      const text=document.createElement('span'); text.className='label'; text.textContent=label;
      button.append(icon,text); grid.append(button);
    }
  }
  function buildFields(links) {
    fields.replaceChildren();
    for (let index=0; index<MAX; index++) {
      const item=links[index]||{}; const row=document.createElement('div'); row.className='row';
      const name=document.createElement('input'); name.className='name'; name.maxLength=40; name.placeholder='名称'; name.value=item.name||'';
      const url=document.createElement('input'); url.className='url'; url.maxLength=500; url.placeholder='网址'; url.value=item.url||'';
      row.append(name,url); fields.append(row);
    }
  }
  function readFields() {
    return Array.from(fields.querySelectorAll('.row')).map(row => ({
      name:row.querySelector('.name').value.trim(), url:row.querySelector('.url').value.trim()
    })).filter(item => item.url);
  }
  let links=linksFromCfg(); render(links); buildFields(links);
  function syncFaces() {
    const editing=document.documentElement.classList.contains('cfgmode');
    const front=document.getElementById('frontFace'), back=document.getElementById('backFace');
    front.setAttribute('aria-hidden',editing?'true':'false'); back.setAttribute('aria-hidden',editing?'false':'true');
    front.inert=editing; back.inert=!editing;
  }
  new MutationObserver(syncFaces).observe(document.documentElement,{attributes:true,attributeFilter:['class']});
  syncFaces();
  grid.addEventListener('click', event => {
    const button=event.target.closest('.link'); if (button) window.mw?.openUrl(button.dataset.url);
  });
  document.getElementById('clear').addEventListener('click', () => buildFields([]));
  document.getElementById('done').addEventListener('click', () => {
    links=readFields(); window.mw?.saveCfg({links}); render(links); window.mw?.exitCfg();
  });
</script></body></html>
