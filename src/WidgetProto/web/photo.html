<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:transparent; width:100%; height:100%; overflow:hidden;
    font-family:"SF Pro Display","Segoe UI Variable Display","Segoe UI",sans-serif;
    -webkit-user-select:none; user-select:none; }
  .card { width:100%; height:100%; border-radius:16px; overflow:hidden; position:relative;
    border:1px solid rgba(255,255,255,.12); }
  .img { position:absolute; inset:-10%;
    background:
      radial-gradient(ellipse 65% 50% at 30% 70%, #ff8c66 0%, transparent 60%),
      radial-gradient(ellipse 70% 60% at 75% 25%, #7a5cff 0%, transparent 65%),
      radial-gradient(ellipse 90% 70% at 60% 80%, #1d3557 0%, #0a1128 100%);
    animation:kenburns 24s ease-in-out infinite alternate; }
  @keyframes kenburns { from{transform:scale(1) translate(0,0)} to{transform:scale(1.12) translate(2%,-2%)} }
  .cap { position:absolute; left:16px; bottom:12px; color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.5); }
  .cap b { font-size:15px; font-weight:600; display:block; }
  .cap span { font-size:12px; opacity:.85; }
</style></head><body>
<div class="card">
  <div class="img"></div>
  <div class="cap"><b>回忆</b><span>2026年7月13日</span></div>
</div>
</body></html>
