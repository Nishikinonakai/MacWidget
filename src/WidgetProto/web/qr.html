<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="widget.css">
<style>
  :root { --tint:#6D72D9; }
  html.mono.cfgmode { --tint:#6D72D9; }
  .content { perspective:1000px; }
  .flip { position:absolute; inset:0; transform-style:preserve-3d; transition:transform .45s cubic-bezier(.35,0,.25,1); }
  html.cfgmode .flip { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; backface-visibility:hidden; border-radius:inherit; overflow:hidden; }
  .front { padding:18px 20px; display:flex; flex-direction:column; align-items:center; }
  .plate { width:248px; height:248px; border-radius:17px; background:#fff; display:grid; place-items:center; box-shadow:0 1px 5px rgba(0,0,0,.12); }
  .plate[hidden],.summary[hidden],.empty[hidden] { display:none !important; }
  #image { width:224px; height:224px; image-rendering:pixelated; }
  .summary { width:100%; margin-top:12px; color:var(--fg2); text-align:center; font-size:11.5px; line-height:1.35;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .empty { margin:auto; color:var(--fg2); text-align:center; font-size:12px; line-height:1.6; }
  .empty b { display:block; color:var(--fg); font-size:17px; }
  .back { transform:rotateY(180deg); background:var(--card-bg); padding:18px 20px; display:grid; grid-template-rows:auto 1fr auto; gap:10px; }
  .back h3 { color:var(--fg); font-size:15px; font-weight:700; }
  textarea { width:100%; min-width:0; resize:none; border:0; outline:0; border-radius:11px; padding:11px 12px;
    background:var(--hairline); color:var(--fg); font:inherit; font-size:13px; line-height:1.5; user-select:text; -webkit-user-select:text; }
  textarea:focus { box-shadow:inset 0 0 0 1.5px var(--tint); }
  .foot { display:grid; grid-template-columns:1fr auto; align-items:end; gap:10px; }
  .meta { min-width:0; color:var(--fg2); font-size:10.5px; line-height:1.35; }
  #error { color:#E25B52; }
  .buttons { display:flex; gap:7px; }
  .buttons button { border:0; border-radius:8px; padding:7px 16px; font:inherit; font-size:11.5px; font-weight:700; cursor:pointer; }
  #clear { background:var(--hairline); color:var(--fg2); } #done { background:var(--tint); color:#fff; }
</style></head><body>
<div class="card"><div class="content"><div class="flip">
  <div class="face front" id="frontFace">
    <div class="plate" id="plate" hidden><img id="image" alt="二维码"></div>
    <div class="summary" id="summary" data-mw-no-localize></div>
    <div class="empty" id="empty"><b id="emptyTitle">离线二维码</b><span id="emptyHint">右键编辑，输入网址或文字</span></div>
  </div>
  <div class="face back" id="backFace" aria-hidden="true" inert>
    <h3 id="editorTitle">离线二维码</h3>
    <textarea id="text" maxlength="1000" placeholder="输入网址或文字…" aria-label="二维码内容"></textarea>
    <div class="foot"><div class="meta"><div id="count">0 / 1000 bytes</div><div id="error"></div></div><div class="buttons"><button id="clear">清除</button><button id="done">完成</button></div></div>
  </div>
</div></div></div>
<script>
  const MAX=1000, english=(window.mw?.lang?.()||new URLSearchParams(location.search).get('lang'))==='en';
  const words=english
    ? {title:'Offline QR',hint:'Right-click to enter a URL or text',placeholder:'Enter a URL or text…',aria:'QR content',clear:'Clear',done:'Done',long:'Text is too long'}
    : {title:'离线二维码',hint:'右键编辑，输入网址或文字',placeholder:'输入网址或文字…',aria:'二维码内容',clear:'清除',done:'完成',long:'内容过长'};
  const input=document.getElementById('text'),plate=document.getElementById('plate'),image=document.getElementById('image');
  const summary=document.getElementById('summary'),empty=document.getElementById('empty'),error=document.getElementById('error'),count=document.getElementById('count');
  document.getElementById('emptyTitle').textContent=words.title; document.getElementById('emptyHint').textContent=words.hint;
  document.getElementById('editorTitle').textContent=words.title; input.placeholder=words.placeholder; input.setAttribute('aria-label',words.aria);
  document.getElementById('clear').textContent=words.clear; document.getElementById('done').textContent=words.done;
  let text=String(window.mw?.cfg()?.text||'').slice(0,1000); input.value=text;
  const bytes=value=>new TextEncoder().encode(value).length;
  function updateMeta(){const size=bytes(input.value);count.textContent=`${size} / ${MAX} bytes`;error.textContent=size>MAX?words.long:'';return size<=MAX;}
  function render(){
    const value=text.trim(); summary.textContent=value.replace(/\s+/g,' ').slice(0,160);
    empty.hidden=!!value; plate.hidden=!value; summary.hidden=!value;
    if(value)window.mw?.makeQr(value); else image.removeAttribute('src');
  }
  window.mw?.on('qrResult',message=>{
    error.textContent=message.error||'';
    if(message.data){image.src=message.data;plate.hidden=false;empty.hidden=true;}
  });
  input.addEventListener('input',updateMeta);
  document.getElementById('clear').addEventListener('click',()=>{input.value='';updateMeta();input.focus();});
  document.getElementById('done').addEventListener('click',()=>{
    if(!updateMeta())return; text=input.value.trim(); window.mw?.saveCfg({text}); render(); window.mw?.exitCfg();
  });
  function syncFaces(){const editing=document.documentElement.classList.contains('cfgmode'),front=document.getElementById('frontFace'),back=document.getElementById('backFace');front.setAttribute('aria-hidden',editing?'true':'false');back.setAttribute('aria-hidden',editing?'false':'true');front.inert=editing;back.inert=!editing;}
  new MutationObserver(syncFaces).observe(document.documentElement,{attributes:true,attributeFilter:['class']}); syncFaces();updateMeta();render();
</script></body></html>
