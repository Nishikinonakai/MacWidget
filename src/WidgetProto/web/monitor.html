<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:transparent; width:100%; height:100%; overflow:hidden;
    font-family:"SF Pro Display","Segoe UI Variable Display","Segoe UI",sans-serif;
    -webkit-user-select:none; user-select:none; }
  .card { width:100%; height:100%; border-radius:16px; padding:14px 18px;
    display:flex; flex-direction:column; background:rgba(30,30,34,.28);
    border:1px solid rgba(255,255,255,.10); box-shadow:inset 0 1px 0 rgba(255,255,255,.12); }
  .head { display:flex; justify-content:space-between; align-items:baseline; }
  .title { font-size:13px; font-weight:600; color:rgba(255,255,255,.75); letter-spacing:.5px; }
  .val { font-size:26px; font-weight:600; color:#30d158; font-variant-numeric:tabular-nums; }
  canvas { flex:1; width:100%; margin-top:6px; }
</style></head><body>
<div class="card">
  <div class="head"><span class="title">CPU</span><span class="val" id="v">0%</span></div>
  <canvas id="c"></canvas>
</div>
<script>
  const cv=document.getElementById('c'), V=document.getElementById('v');
  const data=new Array(120).fill(0); let t=0;
  function tick(){
    t+=0.08;
    const v=Math.max(2,Math.min(98, 28+22*Math.sin(t)+14*Math.sin(t*2.7)+Math.random()*12));
    data.push(v); data.shift();
    V.textContent=Math.round(v)+'%';
    const dpr=devicePixelRatio, w=cv.clientWidth*dpr, h=cv.clientHeight*dpr;
    if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
    const ctx=cv.getContext('2d');
    ctx.clearRect(0,0,w,h);
    ctx.beginPath();
    data.forEach((d,i)=>{ const x=i/(data.length-1)*w, y=h-d/100*h; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.strokeStyle='#30d158'; ctx.lineWidth=1.8*dpr; ctx.stroke();
    ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath();
    const g=ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'rgba(48,209,88,.30)'); g.addColorStop(1,'rgba(48,209,88,0)');
    ctx.fillStyle=g; ctx.fill();
  }
  setInterval(tick, 100);  // 10Hz canvas 重绘 = 监控类组件的典型负载
</script>
</body></html>
