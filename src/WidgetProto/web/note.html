<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="widget.css">
<style>
  :root { --tint:#D9A825; }
  html.mono.cfgmode { --tint:#D9A825; }
  .content { perspective:1000px; }
  .flip { position:absolute; inset:0; transform-style:preserve-3d; transition:transform .45s cubic-bezier(.35,0,.25,1); }
  html.cfgmode .flip { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; backface-visibility:hidden; border-radius:inherit; overflow:hidden; }
  .front { padding:22px 23px; display:flex; flex-direction:column; background:
    linear-gradient(90deg,transparent 0 24px,rgba(217,168,37,.16) 24px 25px,transparent 25px),
    repeating-linear-gradient(transparent 0 28px,rgba(128,128,128,.09) 28px 29px); }
  .title { min-height:25px; color:var(--fg); font-size:18px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .body { flex:1; margin-top:9px; color:var(--fg); font-size:14px; line-height:29px; white-space:pre-wrap; overflow:hidden; overflow-wrap:anywhere; }
  .empty { margin:auto; color:var(--fg2); text-align:center; font-size:12px; line-height:1.55; }
  .back { transform:rotateY(180deg); background:var(--card-bg); padding:17px 19px; display:grid; grid-template-rows:34px 1fr 29px; gap:9px; }
  input,textarea { width:100%; min-width:0; border:0; outline:0; border-radius:9px; background:var(--hairline); color:var(--fg);
    font:inherit; user-select:text; -webkit-user-select:text; }
  input { padding:7px 10px; font-size:13px; font-weight:650; }
  textarea { resize:none; padding:10px 11px; font-size:13px; line-height:1.5; }
  input:focus,textarea:focus { box-shadow:inset 0 0 0 1.5px var(--tint); }
  .foot { display:flex; align-items:center; gap:8px; }
  .local { flex:1; color:var(--fg2); font-size:10.5px; }
  #done { border:0; border-radius:8px; padding:6px 18px; background:var(--tint); color:#fff; font:inherit; font-size:11.5px; font-weight:700; cursor:pointer; }
</style></head><body>
<div class="card"><div class="content"><div class="flip">
  <div class="face front" id="frontFace"><div class="title" id="viewTitle" data-mw-no-localize></div><div class="body" id="viewBody" data-mw-no-localize></div><div class="empty" id="empty"><span id="emptyTitle">本地速记</span><br><span id="emptyHint">右键 → 编辑「本地速记」开始记录</span></div></div>
  <div class="face back" id="backFace" aria-hidden="true" inert>
    <input id="title" maxlength="80" placeholder="标题（可选）" aria-label="标题（可选）">
    <textarea id="text" maxlength="10000" placeholder="在这里写点什么…" aria-label="速记正文"></textarea>
    <div class="foot"><span class="local">内容只保存在这台电脑上</span><button id="done">完成</button></div>
  </div>
</div></div></div>
<script>
  const titleInput=document.getElementById('title'), textInput=document.getElementById('text');
  const viewTitle=document.getElementById('viewTitle'), viewBody=document.getElementById('viewBody'), empty=document.getElementById('empty');
  const english=(window.mw?.lang?.()||new URLSearchParams(location.search).get('lang'))==='en';
  if(english) {
    document.getElementById('emptyTitle').textContent='Local Note';
    document.getElementById('emptyHint').textContent='Right-click → Edit “Local Note” to start writing';
    titleInput.placeholder='Title (optional)'; titleInput.setAttribute('aria-label','Title (optional)');
    textInput.placeholder='Write something…'; textInput.setAttribute('aria-label','Note body');
    document.querySelector('.local').textContent='Stored only on this device'; document.getElementById('done').textContent='Done';
  }
  function clean(raw) { return {title:String(raw?.title||'').slice(0,80),text:String(raw?.text||'').slice(0,10000)}; }
  let note=clean(window.mw?.cfg()); titleInput.value=note.title; textInput.value=note.text;
  function render() {
    viewTitle.textContent=note.title; viewBody.textContent=note.text;
    viewTitle.hidden=!note.title; viewBody.hidden=!note.text; empty.hidden=!!(note.title||note.text);
  }
  function save() {
    note=clean({title:titleInput.value,text:textInput.value}); render();
    window.mw?.saveCfg({...note,updatedAt:new Date().toISOString()});
  }
  titleInput.addEventListener('input',save); textInput.addEventListener('input',save);
  document.getElementById('done').addEventListener('click',()=>{ save(); window.mw?.exitCfg(); });
  function syncFaces() {
    const editing=document.documentElement.classList.contains('cfgmode');
    const front=document.getElementById('frontFace'),back=document.getElementById('backFace');
    front.setAttribute('aria-hidden',editing?'true':'false'); back.setAttribute('aria-hidden',editing?'false':'true');
    front.inert=editing; back.inert=!editing;
  }
  new MutationObserver(syncFaces).observe(document.documentElement,{attributes:true,attributeFilter:['class']});
  syncFaces(); render();
</script></body></html>
