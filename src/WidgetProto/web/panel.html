<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  /* 组件库：搜索 + 分类栏 + Suggestions + 实时预览。窗口即最终矩形，内容自行滑入。 */
  :root {
    --bg: rgba(242,240,244,.965); --fg: #1d1d1f; --fg2: #6E6E73;
    --inset-bg: rgba(0,0,0,.055); --sel: rgba(0,0,0,.08); --sel-hover: rgba(0,0,0,.055);
    --hair: rgba(0,0,0,.08); --card: rgba(255,255,255,.48); --done-bg: #48555A; --done-fg: #fff;
  }
  html.dark {
    --bg: rgba(40,40,45,.97); --fg: #f2f2f5; --fg2: rgba(255,255,255,.6);
    --inset-bg: rgba(255,255,255,.08); --sel: rgba(255,255,255,.14); --sel-hover: rgba(255,255,255,.075);
    --hair: rgba(255,255,255,.09); --card: rgba(255,255,255,.055); --done-bg: #5A6A70;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:transparent; width:100%; height:100%; overflow:hidden;
    font-family:"Segoe UI Variable Display","Segoe UI","PingFang SC","Microsoft YaHei UI",sans-serif;
    -webkit-user-select:none; user-select:none; color:var(--fg); }
  .panel { position:absolute; inset:0; display:flex; flex-direction:column; background:var(--bg);
    border-radius:16px 16px 0 0; box-shadow:0 -6px 32px rgba(0,0,0,.28), inset 0 .5px 0 rgba(255,255,255,.35);
    transform:translateY(104%); transition:transform .3s cubic-bezier(.2,.8,.25,1); }
  html.show .panel { transform:translateY(0); }

  .main { flex:1; display:flex; min-height:0; }
  aside { flex:0 0 224px; padding:14px 12px; border-right:.5px solid var(--hair); display:flex; flex-direction:column; gap:12px; }
  .search { display:flex; align-items:center; gap:6px; background:var(--inset-bg); border-radius:8px; padding:6px 9px; }
  .search svg { flex:0 0 auto; opacity:.45; }
  .search input { flex:1; min-width:0; border:0; outline:0; background:transparent; font:inherit; font-size:13px; color:var(--fg); }
  .search input::placeholder { color:var(--fg2); }
  .nav-label { margin:4px 9px -4px; font-size:11px; font-weight:600; color:var(--fg2); letter-spacing:.25px; }
  .nav { display:flex; flex-direction:column; gap:2px; }
  .navitem { appearance:none; border:0; width:100%; display:flex; align-items:center; gap:9px; padding:7px 9px;
    border-radius:8px; background:transparent; color:var(--fg); cursor:pointer; font:inherit; font-size:13px; font-weight:550; text-align:left; }
  .navitem:hover { background:var(--sel-hover); }
  .navitem.active { background:var(--sel); font-weight:650; }
  .navitem:focus-visible, .suggestion:focus-visible { outline:2px solid #5C8EF4; outline-offset:1px; }
  .symbol { width:16px; text-align:center; color:var(--fg2); font-size:15px; line-height:15px; }
  .navitem.active .symbol { color:var(--fg); }
  .sidebar-note { margin-top:auto; padding:0 9px; color:var(--fg2); font-size:11.5px; line-height:1.45; }

  section { flex:1; overflow-y:auto; padding:16px 22px 12px; }
  section::-webkit-scrollbar { width:8px; } section::-webkit-scrollbar-thumb { background:var(--inset-bg); border-radius:4px; }
  .section-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:13px; }
  h4 { font-size:13px; font-weight:650; color:var(--fg); }
  .count { flex:0 0 auto; color:var(--fg2); font-size:11.5px; }
  .suggest-wrap { margin-bottom:22px; }
  .suggest-wrap.hide { display:none; }
  .suggestions { display:grid; grid-template-columns:repeat(3,minmax(126px,1fr)); gap:10px; max-width:620px; }
  .suggestion { appearance:none; border:1px solid var(--hair); min-height:72px; border-radius:12px; padding:10px 11px;
    background:var(--card); color:var(--fg); text-align:left; cursor:grab; transition:transform .15s ease,background .15s ease; }
  .suggestion:hover { transform:translateY(-1px); background:var(--sel-hover); }
  .suggestion:active { cursor:grabbing; transform:scale(.98); }
  .suggestion .glyph { display:block; color:var(--accent); font-size:19px; line-height:18px; margin-bottom:6px; }
  .suggestion .name { display:block; font-size:12.5px; font-weight:650; }
  .suggestion .detail { display:block; margin-top:2px; color:var(--fg2); font-size:10.5px; }

  .grid { display:flex; flex-wrap:wrap; gap:26px 30px; align-items:flex-start; }
  .cell { display:flex; flex-direction:column; align-items:center; gap:8px; cursor:grab; }
  .cell.hide { display:none; }
  .prev { position:relative; border-radius:17px; transition:transform .15s ease; }
  .cell:hover .prev { transform:scale(1.03); }
  .cell:active { cursor:grabbing; }
  .prev iframe { border:0; background:transparent; transform-origin:0 0; pointer-events:none; display:block; }
  .cell .name { font-size:12px; color:var(--fg2); }
  .empty { display:none; padding:28px 0; color:var(--fg2); font-size:13px; }
  .empty.show { display:block; }

  footer { flex:0 0 52px; display:flex; align-items:center; gap:16px; padding:0 18px; border-top:.5px solid var(--hair); }
  footer .hint { flex:1; font-size:13px; color:var(--fg2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #done { border:0; outline:0; cursor:pointer; font:inherit; font-size:13px; font-weight:650; color:var(--done-fg);
    background:var(--done-bg); border-radius:8px; padding:7px 22px; }
  #done:hover { filter:brightness(1.08); } #done:active { filter:brightness(.92); }
  @media (max-width:720px) { aside { flex-basis:176px; } .suggestions { grid-template-columns:repeat(2,minmax(118px,1fr)); } section { padding-left:16px; padding-right:16px; } }
</style></head><body>
<div class="panel">
  <div class="main">
    <aside>
      <div class="search">
        <svg width="13" height="13" viewBox="0 0 13 13"><circle cx="5.5" cy="5.5" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="9" y1="9" x2="12.2" y2="12.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="q" type="text" placeholder="搜索组件" autocomplete="off" aria-label="搜索组件">
      </div>
      <div class="nav-label">浏览</div>
      <nav class="nav" id="nav" aria-label="组件分类">
        <button class="navitem active" data-category="all" aria-pressed="true"><span class="symbol">▦</span>全部组件</button>
        <button class="navitem" data-category="schedule" aria-pressed="false"><span class="symbol">◷</span>日程</button>
        <button class="navitem" data-category="info" aria-pressed="false"><span class="symbol">◌</span>信息</button>
        <button class="navitem" data-category="media" aria-pressed="false"><span class="symbol">▶</span>媒体</button>
      </nav>
      <div class="sidebar-note">选择一种组件后，将它拖到桌面上的任意位置。</div>
    </aside>
    <section>
      <div class="suggest-wrap" id="suggestWrap">
        <div class="section-head"><h4>精选推荐</h4><span class="count">根据当前桌面</span></div>
        <div class="suggestions" id="suggestions"></div>
      </div>
      <div class="section-head"><h4 id="title">全部组件</h4><span class="count" id="count"></span></div>
      <div class="grid" id="grid" role="list"></div>
      <div class="empty" id="empty">没有符合条件的组件。</div>
    </section>
  </div>
  <footer><div class="hint">将组件拖到桌面上的任意位置来放置…</div><button id="done">完成</button></footer>
</div>
<script>
  const WIDGETS = [
    { kind:'clock',    name:'时钟',     category:'schedule', w:180, h:180, glyph:'◷', detail:'时间与世界时钟', accent:'#E96A66' },
    { kind:'calendar', name:'日历',     category:'schedule', w:180, h:180, glyph:'▦', detail:'日期与月历', accent:'#E96A66' },
    { kind:'monitor',  name:'系统监视', category:'info',     w:180, h:180, glyph:'◌', detail:'CPU、内存与磁盘', accent:'#5D93F7' },
    { kind:'battery',  name:'电池',     category:'info',     w:180, h:180, glyph:'▰', detail:'电量与充电状态', accent:'#58A968' },
    { kind:'music',    name:'正在播放', category:'media',    w:360, h:180, glyph:'♫', detail:'媒体播放控制', accent:'#B47BE8' },
    { kind:'weather',  name:'天气',     category:'info',     w:360, h:180, glyph:'☀', detail:'当前天气与预报', accent:'#E99C34' },
    { kind:'photo',    name:'照片',     category:'media',    w:360, h:360, glyph:'▧', detail:'文件夹照片轮播', accent:'#C1785E' },
  ];
  const CATEGORY = { all:'全部组件', schedule:'日程', info:'信息', media:'媒体' };
  const SUGGESTION_ORDER = ['weather', 'calendar', 'photo', 'music'];
  const SCALE = .78;
  const grid = document.getElementById('grid');
  const q = document.getElementById('q');
  const title = document.getElementById('title');
  const count = document.getElementById('count');
  const empty = document.getElementById('empty');
  const suggestWrap = document.getElementById('suggestWrap');
  const suggestions = document.getElementById('suggestions');
  let active = 'all';
  let installed = new Set();

  grid.innerHTML = WIDGETS.map(w => `
    <div class="cell pickable" role="listitem" data-kind="${w.kind}" data-category="${w.category}" data-name="${w.name} ${w.kind}">
      <div class="prev" style="width:${w.w*SCALE}px;height:${w.h*SCALE}px">
        <iframe src="${w.kind}.html" width="${w.w}" height="${w.h}" style="transform:scale(${SCALE})"></iframe>
      </div><div class="name">${w.name}</div>
    </div>`).join('');

  const post = m => window.chrome?.webview?.postMessage(m);

  // 预览恒全彩，只跟随深浅外观（macOS 组件库语义）。
  function tintFrames() {
    const dark = document.documentElement.classList.contains('dark');
    document.querySelectorAll('iframe').forEach(f => { try { f.contentDocument?.documentElement?.classList.toggle('dark', dark); } catch {} });
  }
  document.querySelectorAll('iframe').forEach(f => f.addEventListener('load', tintFrames));

  function renderSuggestions() {
    const missing = SUGGESTION_ORDER.filter(kind => !installed.has(kind));
    const picks = (missing.length ? missing : SUGGESTION_ORDER).slice(0, 3).map(kind => WIDGETS.find(w => w.kind === kind));
    suggestions.innerHTML = picks.map(w => `<button class="suggestion pickable" data-kind="${w.kind}" style="--accent:${w.accent}" aria-label="拖出${w.name}">
      <span class="glyph">${w.glyph}</span><span class="name">${w.name}</span><span class="detail">${w.detail}</span>
    </button>`).join('');
  }

  function applyFilter() {
    const term = q.value.trim().toLowerCase();
    let shown = 0;
    document.querySelectorAll('#grid .cell').forEach(cell => {
      const matchesCategory = active === 'all' || cell.dataset.category === active;
      const matchesSearch = !term || cell.dataset.name.toLowerCase().includes(term);
      const visible = matchesCategory && matchesSearch;
      cell.classList.toggle('hide', !visible);
      if (visible) shown++;
    });
    title.textContent = term ? `搜索结果：${q.value.trim()}` : CATEGORY[active];
    count.textContent = `${shown} 个组件`;
    empty.classList.toggle('show', shown === 0);
    suggestWrap.classList.toggle('hide', active !== 'all' || !!term);
  }

  document.getElementById('nav').addEventListener('click', e => {
    const item = e.target.closest('.navitem'); if (!item) return;
    active = item.dataset.category;
    document.querySelectorAll('.navitem').forEach(n => { const selected = n === item; n.classList.toggle('active', selected); n.setAttribute('aria-pressed', selected); });
    applyFilter();
  });
  q.addEventListener('input', applyFilter);

  // 拖出放置：位移 >6px 即交棒宿主（宿主用真实光标循环接管，网页端不再跟踪）。
  let pick = null, px = 0, py = 0;
  document.querySelector('section').addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const cell = e.target.closest('.pickable'); if (!cell) return;
    pick = cell.dataset.kind; px = e.screenX; py = e.screenY;
  });
  addEventListener('pointermove', e => {
    if (!pick) return;
    if (Math.hypot(e.screenX - px, e.screenY - py) > 6) { post({ t:'pickup', kind:pick }); pick = null; }
  });
  addEventListener('pointerup', () => pick = null);

  window.chrome?.webview?.addEventListener('message', e => {
    const m = e.data || {};
    if (m.t === 'state') {
      document.documentElement.classList.toggle('dark', !!m.dark);
      installed = new Set(m.installed || []);
      tintFrames(); renderSuggestions(); applyFilter();
    } else if (m.t === 'show') { requestAnimationFrame(() => document.documentElement.classList.add('show')); q.focus(); }
    else if (m.t === 'hide') document.documentElement.classList.remove('show');
  });
  document.getElementById('done').addEventListener('click', () => post({ t:'done' }));
  addEventListener('keydown', e => { if (e.key === 'Escape') post({ t:'done' }); });
  addEventListener('contextmenu', e => e.preventDefault());
  renderSuggestions(); applyFilter();
</script>
</body></html>
