<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="widget.css">
<style>
  /* 天气 · Medium（360×180 帧 / 344×164 卡）：自绘气象渐变底（深浅外观不变，mono 渐隐入统一材质） */
  .card { --own-bg: linear-gradient(165deg, #4A7BB5 0%, #38598F 55%, #2C4470 100%); }
  .content { padding: 14px 18px 13px; display: flex; flex-direction: column; justify-content: space-between; color: #fff; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .city { font-size: 15px; font-weight: 600; }
  .temp { font-size: 40px; font-weight: 500; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .cond { font-size: 12px; opacity: .88; margin-top: 2px; }
  .glyph { font-size: 30px; line-height: 1; filter: drop-shadow(0 1px 3px rgba(0,0,0,.2)); }
  .row { display: flex; justify-content: space-between; }
  .hour { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; opacity: .92; }
  .hour em { font-style: normal; font-size: 15px; }
  .hour b { font-weight: 600; font-size: 12.5px; font-variant-numeric: tabular-nums; }
</style></head><body>
<div class="card"><div class="content">
  <div class="top">
    <div>
      <div class="city">杭州市 ◃</div>
      <div class="temp">35°</div>
      <div class="cond">晴 最高 37° 最低 28°</div>
    </div>
    <div class="glyph">☀️</div>
  </div>
  <div class="row">
    <div class="hour"><span>现在</span><em>🌞</em><b>35°</b></div>
    <div class="hour"><span>19时</span><em>🌤️</em><b>33°</b></div>
    <div class="hour"><span>20时</span><em>⛅</em><b>31°</b></div>
    <div class="hour"><span>21时</span><em>☁️</em><b>30°</b></div>
    <div class="hour"><span>22时</span><em>☁️</em><b>30°</b></div>
    <div class="hour"><span>23时</span><em>🌙</em><b>29°</b></div>
  </div>
</div></div>
</body></html>
