<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="widget.css"><style>
  :root { --tint:#fff; }
  .card { --own-bg:linear-gradient(165deg,#4a7bb5,#38598f 55%,#2c4470); }
  .content { perspective:1100px; }
  .flip { position:absolute; inset:0; transform-style:preserve-3d; transition:transform .48s cubic-bezier(.35,0,.25,1); }
  html.cfgmode .flip { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; backface-visibility:hidden; overflow:hidden; }
  .front { padding:13px 18px 11px; color:#fff; display:flex; flex-direction:column; }
  .top { display:flex; align-items:flex-start; } .city { font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:230px; }
  .cur { font-size:38px; font-weight:300; line-height:1.08; margin-top:1px; font-variant-numeric:tabular-nums; }
  .cond { font-size:12px; opacity:.92; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:246px; }
  .big-ico { margin-left:auto; font-size:30px; line-height:1; } .hrs { margin-top:auto; display:flex; }
  .h { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; } .h .l { font-size:10.5px; opacity:.8; }
  .h .i { font-size:15px; line-height:1.25; } .h .t { font-size:11.5px; font-weight:600; } html.stale .front { opacity:.62; transition:opacity .3s ease; }
  .back { transform:rotateY(180deg); background:var(--card-bg); padding:14px 16px 12px; display:flex; flex-direction:column; color:var(--fg); }
  .back h3 { font-size:14px; margin-bottom:9px; } .search { display:flex; gap:7px; } .search input { min-width:0; flex:1; border:0; outline:0; border-radius:7px; padding:7px 8px; background:var(--hairline); color:var(--fg); font:inherit; font-size:12px; }
  .search button { border:0; border-radius:7px; padding:0 10px; background:#0a84ff; color:#fff; font:inherit; font-size:12px; font-weight:600; cursor:pointer; }
  .places { min-height:0; overflow:auto; margin-top:8px; display:flex; flex-direction:column; gap:3px; } .place { border:0; background:transparent; border-radius:7px; padding:6px 7px; color:var(--fg); text-align:left; cursor:pointer; font:inherit; font-size:12px; } .place:hover { background:var(--hairline); }
  .place small { display:block; margin-top:1px; color:var(--fg2); font-size:10px; } .status { color:var(--fg2); font-size:11px; padding:8px 2px; } .attrib { margin-top:auto; color:var(--fg2); font-size:9.5px; }
</style></head><body><div class="card"><div class="content"><div class="flip">
  <div class="face front"><div class="top"><div><div class="city" id="city">--</div><div class="cur" id="cur">--°</div><div class="cond" id="cond">加载中</div></div><div class="big-ico" id="bigico">☁️</div></div><div class="hrs" id="hrs"></div></div>
  <div class="face back"><h3>天气地点</h3><div class="search"><input id="query" placeholder="输入城市或地区" maxlength="120" autocomplete="off"><button id="find">搜索</button></div><div class="places" id="places"></div><div class="attrib">搜索：Open-Meteo · 天气：MET Norway</div></div>
</div></div></div><script>
  const $=id=>document.getElementById(id), cfg=window.mw?.cfg()||{};
  const en=window.mw?.lang?.()==='en'||new URLSearchParams(location.search).get('lang')==='en';
  const tx=(zh,enText)=>en?enText:zh;
  let cur={name:cfg.city||tx('杭州','Hangzhou'),lat:Number(cfg.lat??30.25),lon:Number(cfg.lon??120.17),timezone:cfg.timezone||'Asia/Shanghai'};
  const topic=()=>`weather@${cur.lat},${cur.lon}`;
  function icon(s=''){ if(s.includes('thunder'))return'⛈️'; if(s.includes('snow')||s.includes('sleet'))return'🌨️'; if(s.includes('rain')||s.includes('showers'))return'🌧️'; if(s.includes('fog'))return'🌫️'; if(s.includes('partly'))return'⛅'; if(s.includes('cloud'))return'☁️'; return s.includes('night')?'🌙':'☀️'; }
  function label(s=''){ const z=s.includes('thunder')?'雷雨':s.includes('snow')?'降雪':s.includes('rain')?'有雨':s.includes('fog')?'有雾':s.includes('cloud')?'多云':'晴朗'; return en?({雷雨:'Thunderstorms',降雪:'Snow',有雨:'Rain',有雾:'Fog',多云:'Cloudy',晴朗:'Clear'}[z]):z; }
  function hour(t){ try{return new Intl.DateTimeFormat(en?'en-GB':'zh-CN',{timeZone:cur.timezone,hour:'2-digit',hourCycle:'h23'}).formatToParts(new Date(t)).find(x=>x.type==='hour')?.value||'--';}catch{return'--';} }
  function render(d){ $('city').textContent=cur.name; $('cur').textContent=`${d.temp}°`; $('cond').textContent=`${label(d.sym)} ${en?'High':'最高'} ${d.hi}° ${en?'Low':'最低'} ${d.lo}°`; $('bigico').textContent=icon(d.sym); $('hrs').innerHTML=[{l:en?'Now':'现在',i:icon(d.sym),t:d.temp},...(d.hours||[]).slice(0,5).map(x=>({l:hour(x.time),i:icon(x.sym),t:x.temp}))].map(x=>`<div class="h"><span class="l">${x.l}</span><span class="i">${x.i}</span><span class="t">${x.t}°</span></div>`).join(''); }
  $('city').textContent=cur.name; const onData=m=>{if(m.topic!==topic()||m.status==='loading')return; document.documentElement.classList.toggle('stale',m.status!=='ok'||!!m.stale); if(m.data)render(m.data); else if(m.status==='error')$('cond').textContent=tx('暂时无法获取天气','Weather is temporarily unavailable');};
  if(window.mw)mw.subscribe(topic(),onData); else render({temp:35,sym:'clearsky_day',hi:37,lo:28,hours:[]});
  let activeQuery='';
  function status(text){const el=document.createElement('div');el.className='status';el.textContent=text;$('places').replaceChildren(el);}
  function search(){const q=$('query').value.trim(); if(q.length<2){activeQuery='';status(tx('请输入至少两个字符','Enter at least two characters'));return;} activeQuery=q;status(tx('正在搜索…','Searching…')); window.mw?.log('weather search '+q); window.chrome?.webview?.postMessage({t:'placeSearch',q});}
  $('find').onclick=search; $('query').addEventListener('keydown',e=>{if(e.key==='Enter')search();});
  window.mw?.on('placeResults',m=>{if(m.q!==activeQuery)return;const list=m.results||[],box=$('places');box.replaceChildren();if(list.length)list.forEach((x,i)=>{const b=document.createElement('button');b.className='place';b.dataset.i=i;b.append(document.createTextNode(x.name));const small=document.createElement('small');small.textContent=[x.admin,x.country].filter(Boolean).join(' · ');b.append(small);box.append(b);});else status(m.error?tx('搜索服务暂不可用','Search is unavailable'):tx('未找到地点','No locations found'));box._data=list;});
  $('places').onclick=e=>{const b=e.target.closest('.place');if(!b)return;const p=$('places')._data?.[+b.dataset.i];if(!p)return; window.mw?.unsubscribe(topic());cur=p;window.mw?.saveCfg({city:p.name,lat:p.lat,lon:p.lon,timezone:p.timezone});$('city').textContent=cur.name;$('cur').textContent='--°';$('cond').textContent=tx('加载中','Loading');window.mw?.subscribe(topic(),onData);window.mw?.exitCfg();};
</script></body></html>
