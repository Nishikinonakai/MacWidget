name: Build MacWidget

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macwidget-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress --yes

      - name: Restore and publish x64 build
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') {
            '${{ github.ref_name }}'.TrimStart('v')
          } else {
            "0.2.0-ci.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          dotnet restore src/WidgetProto/WidgetProto.csproj --runtime win-x64
          dotnet publish src/WidgetProto/WidgetProto.csproj `
            --configuration Release --runtime win-x64 --self-contained true --no-restore `
            --output publish -p:Version=$version -p:InformationalVersion="$version+$env:GITHUB_SHA"

      - name: Validate Windows operational scripts
        shell: pwsh
        run: |
          foreach ($relativePath in @('tools\smoke-installed.ps1', 'tools\verify-installer.ps1', 'tools\prepare-steampipe.ps1', 'tools\verify-steam-content.ps1')) {
            $script = Join-Path $env:GITHUB_WORKSPACE $relativePath
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw "PowerShell parser errors in ${relativePath}:`n$($errors | Out-String)"
            }

            # Windows PowerShell 5.1 treats BOM-less source as the active code page.
            # Keep operational scripts ASCII-only so they load identically on every system locale.
            $nonAscii = @([System.IO.File]::ReadAllBytes($script) | Where-Object { $_ -gt 0x7F })
            if ($nonAscii.Count -gt 0) {
              throw "$relativePath must stay ASCII-only unless it is written with a UTF-8 BOM."
            }
          }

      - name: Verify shipped third-party notices
        shell: pwsh
        run: |
          $notices = Join-Path $env:GITHUB_WORKSPACE 'publish\THIRD-PARTY-NOTICES.md'
          if (-not (Test-Path -LiteralPath $notices -PathType Leaf)) {
            throw 'THIRD-PARTY-NOTICES.md was not copied to the publish directory.'
          }
          $text = Get-Content -LiteralPath $notices -Raw
          foreach ($requiredText in @('Microsoft.Web.WebView2', 'MET Norway', 'CC BY 4.0')) {
            if ($text -notlike "*$requiredText*") {
              throw "Published third-party notices are missing: $requiredText"
            }
          }

      - name: Verify self-contained .NET runtime
        shell: pwsh
        run: |
          foreach ($runtimeFile in @('coreclr.dll', 'hostfxr.dll', 'hostpolicy.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "publish\$runtimeFile") -PathType Leaf)) {
              throw "Self-contained publish is missing $runtimeFile."
            }
          }

      - name: Write Steam content SHA-256 manifest
        shell: pwsh
        run: |
          $contentRoot = (Resolve-Path publish).Path
          $manifestDir = Join-Path $env:GITHUB_WORKSPACE 'steam-content'
          New-Item -ItemType Directory -Path $manifestDir -Force | Out-Null
          $manifest = Join-Path $manifestDir "MacWidget-Steam-Content-${{ steps.version.outputs.version }}.sha256"
          $entries = @(
            Get-ChildItem -LiteralPath $contentRoot -Recurse -File |
              Sort-Object FullName |
              ForEach-Object {
                $relative = $_.FullName.Substring($contentRoot.Length).TrimStart('\') -replace '\\', '/'
                $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                "$hash *$relative"
              }
          )
          if ($entries.Count -eq 0) { throw 'Steam content publish directory is empty.' }
          Set-Content -LiteralPath $manifest -Value $entries -Encoding ascii

      - name: Verify Steam content SHA-256 manifest
        shell: pwsh
        run: |
          $manifests = @(Get-ChildItem steam-content -Filter 'MacWidget-Steam-Content-*.sha256' -File)
          if ($manifests.Count -ne 1) { throw "Expected one Steam content manifest, found $($manifests.Count)." }
          & tools/verify-steam-content.ps1 -ContentRoot publish -ChecksumPath $manifests[0].FullName

      - name: Validate embedded WebView2 bootstrapper
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature installer/MicrosoftEdgeWebview2Setup.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Microsoft Corporation*') {
            throw "Unexpected WebView2 bootstrapper signature: $($signature.Status) / $($signature.SignerCertificate.Subject)"
          }

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found: $iscc" }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=$env:GITHUB_WORKSPACE\publish" "$env:GITHUB_WORKSPACE\installer\macwidget.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }

      - name: Write installer SHA-256
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem installer -Filter 'MacWidget-Setup-v*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one installer, found $($installers.Count)." }
          $installer = $installers[0]
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -NoNewline
          Copy-Item tools/verify-installer.ps1 installer/Verify-MacWidgetInstaller.ps1

      - name: Upload private installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: MacWidget-Setup-${{ steps.version.outputs.version }}
          path: |
            installer/MacWidget-Setup-v*.exe
            installer/MacWidget-Setup-v*.exe.sha256
            installer/Verify-MacWidgetInstaller.ps1
          if-no-files-found: error
          retention-days: 14

      - name: Upload private Steam content artifact
        uses: actions/upload-artifact@v7
        with:
          name: MacWidget-Steam-Content-${{ steps.version.outputs.version }}
          path: |
            publish/**
            steam-content/MacWidget-Steam-Content-*.sha256
            tools/verify-steam-content.ps1
          if-no-files-found: error
          retention-days: 14
